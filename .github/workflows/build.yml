          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              private Button makeButton(String label, int color) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setAllCaps(false);
                  b.setTextColor(0xFFFFFFFF);
                  b.setTextSize(16);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(14));
                  b.setBackground(g);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(dp(220), dp(52));
                  p.setMargins(0, dp(10), 0, 0);
                  b.setLayoutParams(p);
                  return b;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER_HORIZONTAL);
                  l.setBackgroundColor(0xFF121417);
                  l.setPadding(dp(24), dp(40), dp(24), dp(24));
                  TextView title = new TextView(this);
                  title.setText("Annot8");
                  title.setTextSize(32);
                  title.setTextColor(0xFFFFFFFF);
                  TextView t = new TextView(this);
                  t.setTextSize(16);
                  t.setTextColor(0xFFB8C2CC);
                  t.setPadding(0, dp(16), 0, dp(16));
                  t.setText("Draw over any app.\n\nTap Start. The first time, allow Display over other apps, then come back and tap Start again.\n\nDrag the handle at the top of the toolbar to move it, and tap the handle to fold it. Tap Touch to use the app underneath, and Draw to write again.");
                  Button start = makeButton("Start", 0xFF4DA3FF);
                  start.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { startOverlay(); }
                  });
                  Button stop = makeButton("Stop", 0xFF3A4048);
                  stop.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) { stopService(new Intent(MainActivity.this, OverlayService.class)); }
                  });
                  l.addView(title);
                  l.addView(t);
                  l.addView(start);
                  l.addView(stop);
                  setContentView(l);
              }

              private void startOverlay() {
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow Display over other apps, then come back", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  Intent i = new Intent(this, OverlayService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                  moveTaskToBack(true);
              }
          }
